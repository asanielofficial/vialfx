# Single-platform CMake build for Vial on Linux (Ubuntu).
# Builds the Standalone + VST3 + AU plugin and runs unit tests.
name: CMake on a single platform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout (with JUCE submodule)
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Linux build dependencies
      # JUCE on Linux needs ALSA, X11/XComposite/XCursor/XRandr/XRender, FreeType,
      # Fontconfig, and Mesa GL headers. We disable JUCE_WEB_BROWSER and
      # JUCE_USE_CURL in CMakeLists.txt so libwebkit2gtk and libcurl are NOT required.
      # See JUCE/docs/Linux Dependencies.md for the full list.
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libasound2-dev \
          libjack-jackd2-dev \
          ladspa-sdk \
          libfreetype-dev \
          libfontconfig1-dev \
          libx11-dev \
          libxcomposite-dev \
          libxcursor-dev \
          libxext-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxrender-dev \
          libglu1-mesa-dev \
          mesa-common-dev

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure
