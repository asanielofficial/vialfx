name: Build VialFX (Linux)

on:
  push:
    branches: [ main, 'vialfx-*' ]
  pull_request:
  workflow_dispatch:

jobs:
  vst3:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libasound2-dev libfreetype6-dev libgl1-mesa-dev libcurl4-openssl-dev \
            libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev

      - name: Engine test (headless DSP checks)
        run: |
          # Passthrough, filters, routing, key tracking, all 9 effects, LFOs without MIDI. Fails on any check.
          make -C effects/tests -j"$(nproc)"

      - name: Build VialFX VST3
        run: |
          set +e
          make -C effects/builds/linux_vst VST3 CONFIG=Release AR=gcc-ar \
            SIMDFLAGS="-msse2" GLFLAGS="" BUILD_DATE="$(date +'%Y %m %d %H %M')" > build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            # Surface the first errors as annotations so they are readable without the full log.
            grep -n -m 40 -E "error|undefined reference|No such file|\*\*\*" build.log \
              | cut -c1-450 | while IFS= read -r line; do echo "::error::${line}"; done
            echo "::error::last lines: $(tail -n 6 build.log | tr '\n' '|' | cut -c1-600)"
          fi
          exit $status

      - name: Check for Vital branding and service domains
        run: |
          set +e
          # The built plugin must not contain the original product's domains or author/company names.
          strings -a effects/builds/linux_vst/build/VialFX.vst3/Contents/x86_64-linux/VialFX.so > binary_strings.txt
          if grep -i -n -E "vital\.audio|account\.vital|store\.vital|forum\.vital|vital audio|tytel" binary_strings.txt | head -20 > hits.txt && [ -s hits.txt ]; then
            while IFS= read -r l; do echo "::error::[binary] $l"; done < hits.txt
            exit 1
          fi
          # No first-party source/build file (outside third_party, the licence files and copyright headers) may reference them either.
          if grep -rIn -i -E "vital\.audio|vital audio|tytel\.org|matthewtytel" --exclude-dir=third_party --exclude-dir=.git \
               --exclude=LICENSE --exclude=NOTICE.md --exclude=copyright --exclude=changelog --exclude-dir=debian \
               src effects Makefile README.md 2>/dev/null | grep -v -E "Copyright 20[0-9-]+ Matt Tytel" | head -20 > srchits.txt && [ -s srchits.txt ]; then
            while IFS= read -r l; do echo "::error::[source] $l"; done < srchits.txt
            exit 1
          fi
          echo "branding check passed"

      - name: Package
        run: |
          mkdir -p dist
          cp -r effects/builds/linux_vst/build/VialFX.vst3 dist/
          ls -R dist | head -30

      - uses: actions/upload-artifact@v4
        with:
          name: VialFX-linux-vst3
          path: dist

      - name: Validate with pluginval
        run: |
          set +e
          sudo apt-get install -y --no-install-recommends xvfb unzip wget gdb libfreetype6 libasound2 libcurl4 libxrandr2 libxinerama1 libxcursor1
          wget -q https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval_Linux.zip
          PLUGIN=effects/builds/linux_vst/build/VialFX.vst3
          final=0

          # pluginval randomises parameter values, so run several fixed seeds. On a crash, rerun
          # the same seed under gdb to capture a backtrace and the last verbose output.
          run_mode() {
            mode=$1; extra=$2; level=$3
            for seed in 1 2 3 4 5 6; do
              xvfb-run -a ./pluginval --strictness-level 5 --validate-in-process $extra --random-seed $seed \
                --output-dir "$PWD" "$PLUGIN" > val_${mode}_$seed.log 2>&1
              rc=$?
              echo "[$mode] seed $seed exit=$rc"
              if [ $rc -ne 0 ]; then
                if [ $rc -ge 128 ]; then
                  xvfb-run -a gdb -batch -ex "set pagination off" -ex run -ex "bt 30" \
                    --args ./pluginval --strictness-level 5 --validate-in-process $extra --verbose --random-seed $seed \
                    --output-dir "$PWD" "$PLUGIN" > gdb_${mode}_$seed.log 2>&1
                  grep -E "^#[0-9]+" gdb_${mode}_$seed.log | head -30 | cut -c1-330 | while IFS= read -r l; do echo "::$level::[$mode seed $seed bt] $l"; done
                  grep -B16 -m1 -E "SIGSEGV|Program received" gdb_${mode}_$seed.log | cut -c1-240 | tr '\n' '|' | cut -c1-1800 | while IFS= read -r l; do echo "::$level::[$mode seed $seed before-crash] $l"; done
                else
                  grep -i -E "fail|error|assert" val_${mode}_$seed.log | head -15 | cut -c1-300 | while IFS= read -r l; do echo "::$level::[$mode seed $seed] $l"; done
                fi
                return $rc
              fi
            done
            return 0
          }

          run_mode nogui "--skip-gui-tests" error
          final=$?
          run_mode gui "" warning
          exit $final

      - name: GUI smoke test (clicks through the editor)
        if: always()
        run: |
          set +e
          make -C effects/tests/gui_smoke -j"$(nproc)" > smoke_build.log 2>&1
          if [ $? -ne 0 ]; then
            grep -E "error" smoke_build.log | head -15 | cut -c1-300 | while IFS= read -r l; do echo "::error::[smoke build] $l"; done
            exit 1
          fi
          PLUGIN="$PWD/effects/builds/linux_vst/build/VialFX.vst3"
          xvfb-run -a gdb -batch -ex "set pagination off" -ex run -ex "bt 30" \
            --args effects/tests/gui_smoke/build/gui_smoke "$PLUGIN" > smoke.log 2>&1
          grep -E "\[smoke\]" smoke.log | cut -c1-200 | while IFS= read -r l; do echo "::notice::$l"; done
          if grep -qE "SIGSEGV|SIGABRT|SIGILL|SIGFPE" smoke.log; then
            grep -E "^#[0-9]+" smoke.log | head -30 | cut -c1-330 | while IFS= read -r l; do echo "::error::[smoke bt] $l"; done
            exit 1
          fi
          grep -q "ALL OK" smoke.log || { echo "::error::GUI smoke test did not finish cleanly"; exit 1; }
