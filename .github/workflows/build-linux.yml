name: Build VialFX (Linux)

on:
  push:
    branches: [ main, 'vialfx-*' ]
  pull_request:
  workflow_dispatch:

jobs:
  vst3:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libasound2-dev libfreetype6-dev libgl1-mesa-dev libcurl4-openssl-dev \
            libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev

      - name: Build VialFX VST3
        run: |
          set +e
          make -C effects/builds/linux_vst VST3 CONFIG=Release AR=gcc-ar \
            SIMDFLAGS="-msse2" GLFLAGS="" BUILD_DATE="$(date +'%Y %m %d %H %M')" > build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            # Surface the first errors as annotations so they are readable without the full log.
            grep -n -m 40 -E "error|undefined reference|No such file|\*\*\*" build.log \
              | cut -c1-450 | while IFS= read -r line; do echo "::error::${line}"; done
            echo "::error::last lines: $(tail -n 6 build.log | tr '\n' '|' | cut -c1-600)"
          fi
          exit $status

      - name: Package
        run: |
          mkdir -p dist
          cp -r effects/builds/linux_vst/build/VialFX.vst3 dist/
          ls -R dist | head -30

      - uses: actions/upload-artifact@v4
        with:
          name: VialFX-linux-vst3
          path: dist

      - name: Validate with pluginval
        run: |
          set +e
          sudo apt-get install -y --no-install-recommends xvfb unzip wget libfreetype6 libasound2 libcurl4 libxrandr2 libxinerama1 libxcursor1
          wget -q https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval_Linux.zip
          PLUGIN=effects/builds/linux_vst/build/VialFX.vst3

          # Pass 1: everything except the editor (load, bus layouts, audio, state, automation).
          xvfb-run -a ./pluginval --strictness-level 5 --validate-in-process --skip-gui-tests \
            --output-dir "$PWD" "$PLUGIN" > val_nogui.log 2>&1
          s1=$?
          echo "pass 1 (no GUI) exit=$s1"
          if [ $s1 -ne 0 ]; then
            grep -n -i -E "fail|error|crash|assert" val_nogui.log | head -25 | cut -c1-300 | while IFS= read -r l; do echo "::error::[nogui] $l"; done
            echo "::error::[nogui] tail: $(tail -n 8 val_nogui.log | tr '\n' '|' | cut -c1-700)"
          fi

          # If pass 1 crashed, rerun under gdb to get a backtrace and the last verbose output.
          if [ $s1 -ge 128 ]; then
            sudo apt-get install -y --no-install-recommends gdb
            xvfb-run -a gdb -batch -ex "set pagination off" -ex run -ex "bt 30" -ex "info sharedlibrary" \
              --args ./pluginval --strictness-level 5 --validate-in-process --skip-gui-tests --verbose \
              --output-dir "$PWD" "$PLUGIN" > gdb.log 2>&1
            grep -n -E "^#[0-9]+" gdb.log | head -30 | cut -c1-330 | while IFS= read -r l; do echo "::error::[bt] $l"; done
            grep -n -B14 -m1 -E "SIGSEGV|Program received" gdb.log | cut -c1-260 | tr '\n' '|' | cut -c1-1500 | while IFS= read -r l; do echo "::error::[before-crash] $l"; done
          fi

          # Pass 2: with the editor under Xvfb (informational, does not fail the job).
          xvfb-run -a ./pluginval --strictness-level 5 --validate-in-process \
            --output-dir "$PWD" "$PLUGIN" > val_gui.log 2>&1
          s2=$?
          echo "pass 2 (GUI) exit=$s2"
          if [ $s2 -ne 0 ]; then
            grep -n -i -E "fail|error|crash|assert" val_gui.log | head -25 | cut -c1-300 | while IFS= read -r l; do echo "::warning::[gui] $l"; done
            echo "::warning::[gui] tail: $(tail -n 8 val_gui.log | tr '\n' '|' | cut -c1-700)"
          fi
          exit $s1
